; PlatformIO Project Configuration File
;
; Robot Controller Firmware for the Rotato 2027 board:
;   ESP32 D1 Mini (ESP32-WROOM-32) + AT8236 dual H-bridge for the drive motors
; Rotato 2027
;
; Build:     pio run
; Flash:     pio run --target upload    (VS Code "Upload" button) - USB if a board is
;            plugged in, otherwise over WiFi to custom_ota_host (scripts/upload_auto.py)
; Flash OTA: pio run -e d1_mini32_ota --target upload     (always WiFi - see [env:d1_mini32_ota])
; Web UI:    pio run --target uploadfs   (upload LittleFS filesystem first!)
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Plain "pio run" only builds the USB environment; the OTA one is opt-in.
default_envs = d1_mini32

[env:d1_mini32]
platform = espressif32
board = wemos_d1_mini32
framework = arduino

; ── Filesystem ──────────────────────────────────────────────────────────────
; LittleFS partition is kept for future static files (images, extra JS, etc.)
; The web UI (ui/index.html) is embedded directly into firmware via
; scripts/embed_web_ui.py — "Upload Filesystem Image" is NOT required.
board_build.filesystem = littlefs

; ── Partition table ──────────────────────────────────────────────────────────
; OTA requires two app partitions.  min_spiffs.csv gives:
;   app0 / app1 — 1.9 MB each (plenty for BLE + web-server firmware)
;   data        — 192 KB  (reserved; mostly empty since UI is in firmware)
; Without this the Update library has nowhere to write and OTA will fail.
board_build.partitions = min_spiffs.csv

; ── Pre-build scripts ───────────────────────────────────────────────────────
; auto_version.py runs before every compile:
;   reads src/version.h (MAJOR, fallback PCB rev) + build_number.txt + the KiCad board title block,
;   writes src/version_build.h with FW_VERSION_FULL ("MAJOR.BUILD"), PCB_REVISION_STR, timestamps.
extra_scripts =
    pre:scripts/auto_version.py
    pre:scripts/embed_web_ui.py
    pre:scripts/upload_auto.py
    post:scripts/copy_firmware.py

; ── Source files ────────────────────────────────────────────────────────────
build_src_filter = +<*> +<hardware/*> +<connectivity/*>

; ── Upload: USB or WiFi ─────────────────────────────────────────────────────
; "Upload" flashes over USB when an ESP32 USB-serial adapter is plugged in, and
; over WiFi to this robot otherwise (IP or name.local). Override for one run
; with --upload-port COM5 or --upload-port 192.168.4.1.
custom_ota_host = 192.168.86.246

; ── Serial monitor ──────────────────────────────────────────────────────────
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; ── Build flags ──────────────────────────────────────────────────────────────
; CORE_DEBUG_LEVEL controls how much ESP-IDF internal logging is shown on Serial.
;   0 = None, 1 = Error, 2 = Warn, 3 = Info, 4 = Debug, 5 = Verbose
; Level 3 (Info) shows WiFi driver events like AP start, channel, station connect.
; Lower this back to 0 or 1 once the AP is confirmed working to reduce noise.
build_flags =
    -DCORE_DEBUG_LEVEL=3
    ; ESP32 D1 Mini: Serial goes through the on-board USB-UART chip (CH340/CP2104),
    ; so no USB-CDC flags are needed (those were for the ESP32-C3).
    ; -DMBEDTLS_SSL_MAX_CONTENT_LEN=65536 

; ── Libraries ───────────────────────────────────────────────────────────────
; ESPAsyncWebServer  — Non-blocking async web server + WebSocket support
; ArduinoJson        — Lightweight JSON parsing/building for WebSocket messages
; NimBLE-Arduino     — Lightweight BLE stack (stubs only, for future Android app)
lib_deps =
    esp32async/ESPAsyncWebServer @ ^3.10.3
    bblanchon/ArduinoJson @ ^7.3.1
    h2zero/NimBLE-Arduino @ ^2.2.3

; ── Over-the-air (WiFi) upload ──────────────────────────────────────────────
; Same firmware as [env:d1_mini32], but "Upload" sends it over WiFi to the
; robot's POST /update endpoint instead of the USB cable.
;
;   pio run -e d1_mini32_ota --target upload
;   pio run -e d1_mini32_ota --target upload --upload-port 192.168.4.1   (other robot / AP mode)
;
; In VS Code: PlatformIO sidebar → Project Tasks → d1_mini32_ota → Upload.
; Set custom_ota_host in [env:d1_mini32] to your robot's IP (shown on the serial monitor at boot and
; in the web UI status). The first flash of a new board must still use USB.
; scripts/ota_upload.py waits for the reboot and checks the robot now reports
; the version that was just built.
[env:d1_mini32_ota]
extends = env:d1_mini32
upload_protocol = custom
upload_port = ${env:d1_mini32.custom_ota_host}
upload_command = "$PYTHONEXE" "$PROJECT_DIR/scripts/ota_upload.py" "$SOURCE" $UPLOAD_PORT auto
