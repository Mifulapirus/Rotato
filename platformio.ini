; PlatformIO Project Configuration File
;
; Robot Controller Firmware for ESP32-C3 Super Mini
; Asmbly Workshop — Democratic Robot 2026
;
; Build:     pio run
; Flash:     pio run --target upload
; Web UI:    pio run --target uploadfs   (upload LittleFS filesystem first!)
;
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

; ── Filesystem ──────────────────────────────────────────────────────────────
; LittleFS stores the web UI (data/index.html) separately from the firmware.
; Run "Upload Filesystem Image" before flashing the firmware.
board_build.filesystem = littlefs

; ── Partition table ──────────────────────────────────────────────────────────
; OTA requires two app partitions.  min_spiffs.csv gives:
;   app0 / app1 — 1.9 MB each (plenty for BLE + web-server firmware)
;   data        — 192 KB  (sufficient for index.html in LittleFS)
; Without this the Update library has nowhere to write and OTA will fail.
board_build.partitions = min_spiffs.csv

; ── Pre-build scripts ───────────────────────────────────────────────────────
; auto_version.py runs before every compile:
;   reads src/version.h (MAJOR/MINOR/PATCH) + build_number.txt,
;   writes src/version_build.h with FW_VERSION_FULL, FW_BUILD_NUMBER, timestamps.
extra_scripts =
    pre:scripts/auto_version.py
    pre:scripts/embed_web_ui.py
    post:scripts/copy_firmware.py

; ── Source files ────────────────────────────────────────────────────────────
build_src_filter = +<*> +<hardware/*> +<connectivity/*>

; ── Serial monitor ──────────────────────────────────────────────────────────
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; ── Build flags ──────────────────────────────────────────────────────────────
; CORE_DEBUG_LEVEL controls how much ESP-IDF internal logging is shown on Serial.
;   0 = None, 1 = Error, 2 = Warn, 3 = Info, 4 = Debug, 5 = Verbose
; Level 3 (Info) shows WiFi driver events like AP start, channel, station connect.
; Lower this back to 0 or 1 once the AP is confirmed working to reduce noise.
build_flags =
    -DCORE_DEBUG_LEVEL=3
    ; ESP32-C3 Super Mini: use the built-in USB hardware for Serial output.
    ; ARDUINO_USB_CDC_ON_BOOT=1 maps Serial → USB-CDC (the USB-C port on the board).
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; -DMBEDTLS_SSL_MAX_CONTENT_LEN=65536 

; ── Libraries ───────────────────────────────────────────────────────────────
; ESPAsyncWebServer  — Non-blocking async web server + WebSocket support
; ArduinoJson        — Lightweight JSON parsing/building for WebSocket messages
; NimBLE-Arduino     — Lightweight BLE stack (stubs only, for future Android app)
lib_deps =
    esp32async/ESPAsyncWebServer @ ^3.10.3
    bblanchon/ArduinoJson @ ^7.3.1
    h2zero/NimBLE-Arduino @ ^2.2.3
